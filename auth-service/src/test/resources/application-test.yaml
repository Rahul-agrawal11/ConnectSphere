spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id
            client-secret: dummy-google-client-secret
            redirect-uri: http://localhost:8081/login/oauth2/code/google
            scope: openid,email,profile
          github:
            client-id: dummy-github-client-id
            client-secret: dummy-github-client-secret
            redirect-uri: http://localhost:8081/login/oauth2/code/github
            scope: user:email,read:user

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hmac-sha256
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  rabbitmq:
    exchange: connectsphere.events
    routing-keys:
      otp: notification.otp
  oauth2:
    authorized-redirect-uri: http://localhost:3000/oauth2/redirect

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false