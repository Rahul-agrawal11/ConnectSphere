server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/cs_auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # OAuth2 Social Login
  security:
    oauth2:
      client:
        registration:
          google:
            client-id:  ${GOOGLE_CLIENT_ID}
            client-secret:  ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
            #"{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
          github:
            client-id:  ${GITHUB_CLIENT_ID}
            client-secret:  ${GITHUB_CLIENT_SECRET}
            scope: user:email, read:user
            redirect-uri: "http://localhost:8080/login/oauth2/code/github"
            #"{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
  oauth2:
    # After OAuth2 success, redirect to this frontend URL with token
    authorized-redirect-uri: ${REDIRECT_URI}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.connectsphere.auth: DEBUG
    org.springframework.security: INFO