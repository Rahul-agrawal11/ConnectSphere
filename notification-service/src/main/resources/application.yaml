server:
  port: ${PORT:8086}

spring:
  application:
    name: notification-service

  cloud:
    loadbalancer:
      retry:
        enabled: false

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 2
        max-concurrency: 5

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${GMAIL_USERNAME}
    password: ${GMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${PORT:8086}

app:
  rabbitmq:
    exchange: connectsphere.events
    queues:
      notification: connectsphere.notification.queue
      dead-letter: connectsphere.notification.dlq
    routing-keys:
      notification: notification.#
  mail:
    enabled: true
    from: ${GMAIL_USERNAME}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.connectsphere.notification: DEBUG
    org.springframework.amqp: WARN
    com.rabbitmq: WARN
    org.springframework.cloud.loadbalancer: WARN