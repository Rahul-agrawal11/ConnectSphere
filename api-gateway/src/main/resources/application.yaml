server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Enables Eureka-based service discovery for lb:// URIs
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ── Auth Service ──────────────────────────────────────────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # ── OAuth2 callback — Spring internal path ────────────────────
        - id: auth-service-oauth2
          uri: lb://auth-service
          predicates:
            - Path=/login/oauth2/**, /oauth2/**

        # ── Post Service ──────────────────────────────────────────────
        - id: post-service
          uri: lb://post-service
          predicates:
            - Path=/api/v1/posts/**

        # ── Comment Service ───────────────────────────────────────────
        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/api/v1/comments/**

        # ── Like Service ──────────────────────────────────────────────
        - id: like-service
          uri: lb://like-service
          predicates:
            - Path=/api/v1/likes/**

        # ── Follow Service ────────────────────────────────────────────
        - id: follow-service
          uri: lb://follow-service
          predicates:
            - Path=/api/v1/follows/**

        # ── Notification Service ──────────────────────────────────────
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

        # ── Media Service ─────────────────────────────────────────────
        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/v1/media/**,/api/v1/stories/**,/files/**

        # ── Search Service ────────────────────────────────────────────
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/v1/search/**,/api/v1/hashtags/**

      # Default filters applied to ALL routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# Eureka registration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# FIX: JWT secret must come from env var — same var used by auth-service.
# The hardcoded value was a mismatch risk if auth-service changes its secret.
# Both MUST use the same value.
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000  # 24 hours

  gateway:
    public-routes:
      # ── Auth public endpoints ──────────────────────────────────────
      - /api/v1/auth/register
      - /api/v1/auth/verify-otp
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      # FIX: search and profile/{id} must be public — guests can look up users
      - /api/v1/auth/search
      - /api/v1/auth/profile/*
      # OAuth2 flow paths
      - /api/v1/auth/oauth2/**
      - /login/oauth2/**
      - /oauth2/**

      # ── Post public endpoints ──────────────────────────────────────
      - /api/v1/posts/public
      # FIX: single post view and user post listing must be public (for PUBLIC-visibility posts)
      - /api/v1/posts/search
      - /api/v1/posts/count/**

      # ── Comment read endpoints (public) ───────────────────────────
      # FIX: comments on a public post should be readable by guests
      - /api/v1/comments/post/**

      # ── Like read endpoints (public) ──────────────────────────────
      # FIX: reaction summary and counts are public (emoji bar visible to guests)
      - /api/v1/likes/summary
      - /api/v1/likes/count
      - /api/v1/likes/target

      # ── Follow public endpoints ───────────────────────────────────
      # FIX: follower/following lists and counts are public (profile page)
      - /api/v1/follows/*/followers
      - /api/v1/follows/*/following
      - /api/v1/follows/*/counts
      - /api/v1/follows/*/followers/count
      - /api/v1/follows/*/following/count
      # Internal endpoint — only accessible within cluster but public at gateway level
      - /api/v1/follows/internal/**

      # ── Search / Hashtag public endpoints ─────────────────────────
      - /api/v1/search/posts
      - /api/v1/search/users
      # FIX: hashtag search autocomplete and trending must be public
      - /api/v1/search/hashtags
      - /api/v1/hashtags/trending
      - /api/v1/hashtags/**

      # ── Stories public reads ──────────────────────────────────────
      # FIX: story listing per user is public (profile page shows stories)
      - /api/v1/stories/user/**

      # ── Actuator ─────────────────────────────────────────────────
      - /actuator/**

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.connectsphere.apigateway: DEBUG