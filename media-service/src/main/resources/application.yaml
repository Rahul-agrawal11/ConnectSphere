server:
  port: ${PORT:8087}

spring:
  application:
    name: media-service

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 55MB

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /
    connection-timeout: 5000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${PORT:8087}

app:
  rabbitmq:
    exchange: connectsphere.events
    routing-keys:
      story: notification.story     # matches notification-service binding: notification.#

  storage:
    provider: local
    local:
      upload-dir: ./uploads
      base-url: http://localhost:${PORT:8087}/files
    s3:
      bucket-name: connectsphere-media
      region: ap-south-1
      access-key: YOUR_AWS_ACCESS_KEY
      secret-key: YOUR_AWS_SECRET_KEY
      cdn-base-url: https://cdn.connectsphere.com

  media:
    allowed-image-types:
      - image/jpeg
      - image/png
      - image/webp
    allowed-video-types:
      - video/mp4
    max-image-size-mb: 10
    max-video-size-mb: 50

  story:
    expiry-hours: 24
    cleanup-cron: "0 */5 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  health:
    rabbit:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.connectsphere.media: DEBUG